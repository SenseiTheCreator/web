<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LR8 - ToDo List</title>
  <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>
  <div class="container">
    <h1>ToDo List</h1>

    <div class="sort">
      <button id="sort-undone-btn">Спочатку невиконані</button>
      <button id="sort-done-btn">Спочатку виконані</button>
    </div>

    <div class="todo">
      <input type="text" id="task-input" placeholder="Додайте завдання">
      <ul id="task-list"></ul>
    </div>
  </div>

  <script src="assets/scripts/script.js"></script>
</body>
</html>
